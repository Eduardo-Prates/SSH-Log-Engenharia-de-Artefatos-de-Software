[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-log-sentinel"
version = "0.5.1"
description = "CLI acadêmica para analisar logs de autenticação OpenSSH."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SSH Log Sentinel contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.16.0"]

[project.scripts]
ssh-log-sentinel = "ssh_log_sentinel.cli:main"

[project.urls]
Repository = "https://github.com/Eduardo-Prates/SSH-Log-Sentinel---Engenharia-de-Artefatos-de-Software"
Issues = "https://github.com/Eduardo-Prates/SSH-Log-Sentinel---Engenharia-de-Artefatos-de-Software/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
