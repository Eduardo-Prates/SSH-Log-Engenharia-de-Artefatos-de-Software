[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-log-sentinel"
version = "0.5.0"
description = "CLI acadêmica para analisar logs de autenticação OpenSSH."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SSH Log Sentinel contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.16.0"]

[project.scripts]
ssh-log-sentinel = "ssh_log_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
